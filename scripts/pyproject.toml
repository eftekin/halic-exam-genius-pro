[project]
name = "halic-exam-sync"
version = "0.1.0"
description = "Turn the university exam Excel into frontend/public/data/exams.json"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sync"]

[tool.pyright]
venvPath = "."
venv = ".venv"
